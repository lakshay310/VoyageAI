## render.yaml — Render Blueprint for VoyageAI
## HOW TO USE:
##   1. Push this repo to GitHub
##   2. Go to https://dashboard.render.com ? New ? Blueprint
##   3. Connect your GitHub repo — Render will read this file automatically
##   4. Fill in the secret env vars marked with "sync: false" in the Render UI
##   5. Click "Apply Blueprint"
##
## NOTE: If using Blueprint, the CLIENT_URL and VITE_API_URL cross-references
##       may require manual update after first deploy. See DEPLOYMENT_GUIDE.md.

services:
  # -- Backend API (Node.js / Express) -----------------------------------------
  - type: web
    name: voyageai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # -- Frontend (Vite / React Static Site) -------------------------------------
  - type: web
    name: voyageai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
